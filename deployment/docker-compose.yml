services:
  redis:
    image: redis:alpine
    container_name: redis
    environment:
      - REDIS_PASSWORD=my-secret-password
    ports:
      - 6379:6379

  bookmark_postgres:
    container_name: bookmark_postgres
    image: postgres:alpine
    env_file:
      - ../.env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookmark"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-data:/var/lib/postgresql

  bookmark_service:
    image: bookmark_service:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: bookmark_service
    depends_on:
      redis:
        condition: service_started
      bookmark_postgres:
        condition: service_healthy
    ports:
      - 8080:8080
    env_file:
      - ../.env
