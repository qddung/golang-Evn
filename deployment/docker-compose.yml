version: "1.1"

services:
  redis:
    image: redis:alpine
    container_name: redis
    environment:
      - REDIS_PASSWORD=my-secret-password
    ports:
      - 6379:6379

  bookmark_service:
    image: bookmark_service:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: bookmark_service
    depends_on:
      - redis
    ports:
      - 8080:8080
    env_file:
      - ./../.env
  bookmark_postgres:
    container_name: bookmark_postgres
    image: postgres:alpine
    env_file:
      - ./../.env
    ports:
      - 5432:5432
